<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig configuration of the MDBridge AppImage, used only on hosts without one (AppRun):
     minimal and container systems that have no fontconfig package. Figures use the fonts compiled
     into MDBridge; this only keeps fontconfig quiet and lets the interface find any system fonts. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
