# Build, test and package MDBridge: Linux AppImage and Windows installer, on every push.
#
# - linux:       build and unit tests on Rocky Linux 9 (the oldest supported glibc; the GUI tests
#                on the offscreen platform, their screenshots uploaded), AppImage,
#                glibc check, smoke test with the Vulkan view (lavapipe) and the software view;
#                the LGPL FFmpeg + SVT-AV1 libraries (packaging/ffmpeg) built there, cached
# - sanitizers:  the build and every test with AddressSanitizer (leaks included) and
#                UndefinedBehaviorSanitizer on Rocky Linux 9 / GCC 11 (MDBRIDGE_SANITIZE)
# - appimage-*:  the AppImage on Ubuntu 22.04 (with Vulkan) and on a bare Rocky Linux 9 (command
#                line without X11 / OpenGL / fonts, whose text image must equal the linux job's,
#                then the interface without a Vulkan driver)
#                every smoke test (packaging/smoke_test.py) also renders the demo project from the
#                command line: an AV1 video (read back with `probe-video`, and ffprobe where
#                installed), charts and previews; on the bare Rocky system that is the batch-on-a-
#                cluster proof (no display, fonts or GPU); with --gui it edits, saves and renders a
#                still through the window (screenshots of every page: gui-screenshots-<platform>);
#                for the AppImage it checks that a fallback library copy is used only where the
#                host lacks the library (packaging/linux/AppRun)
# - windows:     MSVC 2022 build and tests (GUI tests offscreen, screenshots uploaded), zip and
#                installer; smoke test of the installed program
#                (video, charts, preview, the interface, the Start-menu entry opening a project);
#                FFmpeg + SVT-AV1 through vcpkg (packaging/ffmpeg/windows), cached; the Vulkan tests on
#                Mesa's lavapipe (test-only, tools/get_lavapipe.py), cached
# - parity:      MDATK v0.0.4.1 writes project files and records what it reads from them;
#                the AppImage must read them the same way; the commands init, info, list, analyze,
#                export-pdb, render, charts, preview and density info must print and write what
#                MDATK's do (tests/parity/cli_parity.py; figures and videos by their metadata)
# - regenerate:  every generator of tests/data/README.md, run with MDATK v0.0.4.1, MDAnalysis 2.11.0
#                and the pinned numpy / scipy, writes exactly the committed test data
# - release:     tags v* only, after every job passed: attaches the builds to the GitHub release
#
# Local builds: docs/BUILDING.md. The actions are pinned to commit SHAs (versions in comments).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: "6.11.3"
  PY7ZR_VERSION: "1.1.4"  # unpacks Qt's archives (tools/get_qt.py)

jobs:
  linux:
    name: Linux build, tests and AppImage (Rocky Linux 9)
    # glibc 2.34 (RHEL 9) is the oldest the AppImage supports, so it is built there; Qt 6.11's
    # official binaries are built on RHEL 9 with GCC 11 too
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System packages (compiler, build tools, OpenGL headers and Qt's X11 libraries, lavapipe and Xvfb)
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ cmake ninja-build git file binutils findutils which tar xz \
            python3.12 python3.12-pip libglvnd-devel mesa-libGL-devel \
            libX11-xcb libxkbcommon libxkbcommon-x11 xcb-util xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil fontconfig dbus-libs \
            libglvnd-egl libglvnd-glx libglvnd-opengl mesa-libGL mesa-libEGL \
            vulkan-loader mesa-vulkan-drivers xorg-x11-server-Xvfb xorg-x11-xauth
          g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          python3.12 -m pip install "py7zr==$PY7ZR_VERSION"
          python3.12 tools/get_qt.py --version "$QT_VERSION" --arch linux_gcc_64 --out "/opt/Qt/$QT_VERSION/gcc_64" \
            --archive qtbase --archive icu --archive qtsvg
          echo "QT_DIR=/opt/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      # video encoding: rebuilt only when packaging/ffmpeg changes (pins, scripts)
      - name: FFmpeg (LGPL) and SVT-AV1 from the cache
        id: ffmpeg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/ffmpeg/prefix
            build/ffmpeg/ffmpeg-*-source.tar.xz
          key: ffmpeg-rocky9-${{ hashFiles('packaging/ffmpeg/**') }}

      - name: FFmpeg (LGPL) and SVT-AV1 (packaging/ffmpeg/build_ffmpeg.sh)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          dnf install -y --setopt=install_weak_deps=False nasm make pkgconf-pkg-config diffutils gawk
          packaging/ffmpeg/build_ffmpeg.sh --prefix build/ffmpeg/prefix --work build/ffmpeg/work

      # saved right away, so a later failing step does not cost the next run the FFmpeg build
      - name: FFmpeg (LGPL) and SVT-AV1 into the cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/ffmpeg/prefix
            build/ffmpeg/ffmpeg-*-source.tar.xz
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Configure and build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DMDBRIDGE_WARNINGS_AS_ERRORS=ON -DMDBRIDGE_FFMPEG=ON -DMDBRIDGE_FFMPEG_ROOT="$PWD/build/ffmpeg/prefix"
          cmake --build build/release

      - name: Unit tests
        env:
          MDBRIDGE_REQUIRE_VULKAN: "1"  # the Vulkan tests run on lavapipe (mesa-vulkan-drivers), never skip
        run: |
          # the GUI tests (label gui: gui.cases, gui.window, gui.pages, gui.group_pages, gui.forms, gui.problems, gui.jobs, gui.script, gui.tools; offscreen platform) run with the
          # rest; gui.cases saves its screenshots there
          export MDBRIDGE_GUI_SCREENSHOTS="$PWD/gui-test-screenshots"
          ctest --test-dir build/release --output-on-failure
          ctest --test-dir build/release -L gui --no-tests=error -N  # the GUI tests are there

      # the main window as the GUI tests drove it (tests/gui), for review; never compared
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-test-screenshots-linux
          path: gui-test-screenshots
          if-no-files-found: warn

      - name: Vulkan 3D view drawing a molecule (Xvfb, lavapipe)
        env:
          MDBRIDGE_REQUIRE_VULKAN: "1"
          MDBRIDGE_REQUIRE_VULKAN_WINDOW: "1"  # fail instead of skipping when the window gets no Vulkan
        run: xvfb-run -a -s "-screen 0 1024x768x24" build/release/tests/mdbridge_vulkan_window_tests

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt)"
          echo "MDBridge $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $version (CMakeLists.txt)"
            exit 1
          fi

      - name: AppImage
        run: packaging/linux/build_appimage.sh --build build/release --out dist

      - name: glibc check (at most 2.34, RHEL 9)
        run: packaging/linux/check_glibc.sh build/appimage/AppDir 2.34

      - name: Smoke test (render, charts, preview; Vulkan view on lavapipe, software view, project files)
        run: |
          # the build machine has every desktop library: no fallback copy may be used
          xvfb-run -a -s "-screen 0 1600x1000x24" python3.12 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer vulkan --version "${{ steps.version.outputs.version }}" \
            --text-report text-report/text-report.json --screenshot-dir gui-screenshots --expect-fallback none

      # the 3D view (Vulkan on lavapipe, software) and the figure preview, for review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-screenshots-linux
          path: gui-screenshots
          if-no-files-found: warn

      # the text image and metrics drawn here: appimage-rocky must draw the same on a bare system
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: text-report-linux
          path: text-report/text-report.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist/MDBridge-*-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0  # already compressed

      # the corresponding source of the bundled FFmpeg libraries (LGPL 2.1 section 6), attached to
      # releases next to the builds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-ffmpeg-source
          path: build/ffmpeg/ffmpeg-*-source.tar.xz
          if-no-files-found: error
          compression-level: 0

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer (Rocky Linux 9, GCC 11)
    # MDBridge, its tests and the fetched / vendored libraries built with -fsanitize=address,undefined
    # (MDBRIDGE_SANITIZE, docs/BUILDING.md), every test run; any memory error, leak or undefined
    # behaviour fails the job. Qt, FFmpeg and Mesa are prebuilt, so not instrumented (their
    # allocations are still checked for leaks); tests/sanitizers/lsan.supp lists the few leaks of
    # such libraries that are suppressed, each with its reason, never one of MDBridge's.
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 120
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System packages (as the linux job, with GCC's sanitizer runtimes)
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ libasan libubsan cmake ninja-build git findutils which tar xz \
            python3.12 python3.12-pip libglvnd-devel mesa-libGL-devel \
            libX11-xcb libxkbcommon libxkbcommon-x11 xcb-util xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil fontconfig dbus-libs \
            libglvnd-egl libglvnd-glx libglvnd-opengl mesa-libGL mesa-libEGL \
            vulkan-loader mesa-vulkan-drivers xorg-x11-server-Xvfb xorg-x11-xauth
          g++ --version | head -n 1
          rpm -q vulkan-loader
          # the tests' step needs a loader that reads VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING (1.3.275 does)
          grep -q VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING "$(readlink -f /usr/lib64/libvulkan.so.1)" || {
            echo "::error::this Vulkan loader unloads drivers regardless (VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING)"; exit 1; }
          # some AddressSanitizer runtimes fail at start-up with more than 28 bits of mmap
          # randomisation; Rocky 9's GCC 11 runs with the runners' 32 (CI run 45917141958). For diagnosis:
          echo "vm.mmap_rnd_bits = $(cat /proc/sys/vm/mmap_rnd_bits)"

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          python3.12 -m pip install "py7zr==$PY7ZR_VERSION"
          python3.12 tools/get_qt.py --version "$QT_VERSION" --arch linux_gcc_64 --out "/opt/Qt/$QT_VERSION/gcc_64" \
            --archive qtbase --archive icu --archive qtsvg
          echo "QT_DIR=/opt/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      # the linux job's FFmpeg build (same container, same key); only restored here: on a miss (the
      # linux job is still building a changed packaging/ffmpeg) this run tests without video encoding
      - name: FFmpeg (LGPL) and SVT-AV1 from the cache
        id: ffmpeg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/ffmpeg/prefix
            build/ffmpeg/ffmpeg-*-source.tar.xz
          key: ffmpeg-rocky9-${{ hashFiles('packaging/ffmpeg/**') }}

      - name: Configure and build (RelWithDebInfo, -fsanitize=address,undefined)
        env:
          FFMPEG_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: |
          ffmpeg=(-DMDBRIDGE_FFMPEG=OFF)
          if [ "$FFMPEG_HIT" = true ]; then
            ffmpeg=(-DMDBRIDGE_FFMPEG=ON -DMDBRIDGE_FFMPEG_ROOT="$PWD/build/ffmpeg/prefix")
          else
            echo "::warning::FFmpeg is not in the cache yet: the sanitizer build tests without video encoding"
          fi
          cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DMDBRIDGE_WARNINGS_AS_ERRORS=ON -DMDBRIDGE_SANITIZE=address,undefined "${ffmpeg[@]}"
          cmake --build build/sanitize

      - name: Unit and GUI tests under the sanitizers
        env:
          MDBRIDGE_REQUIRE_VULKAN: "1"  # the Vulkan tests on lavapipe, as in the linux job (the GUI tests set offscreen)
          # time limits of the tests scaled for the slower instrumented code (tests/core/time_scale.hpp)
          MDBRIDGE_TIME_SCALE: "5"
          # lavapipe stays loaded until the program ends: the loader would otherwise unload it at
          # vkDestroyInstance, and memory the driver's threads keep for the life of the process would
          # be reported as leaked from an "<unknown module>", which no suppression could name
          VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING: "1"
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export LSAN_OPTIONS="suppressions=$PWD/tests/sanitizers/lsan.supp:print_suppressions=1"
          ctest --test-dir build/sanitize --output-on-failure --parallel 4
          MDBRIDGE_REQUIRE_VULKAN_WINDOW=1 xvfb-run -a -s "-screen 0 1024x768x24" build/sanitize/tests/mdbridge_vulkan_window_tests

  appimage-ubuntu:
    name: AppImage on Ubuntu 22.04 (Vulkan)
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist
      - name: Xvfb and a Vulkan driver (lavapipe)
        run: |
          # the runner image's packages.microsoft.com source is not used here and its outages (403) fail the update
          { grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null || true; } | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer vulkan --version "${{ needs.linux.outputs.version }}" --screenshot-dir gui-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-screenshots-ubuntu
          path: gui-screenshots
          if-no-files-found: warn

  appimage-rocky:
    name: AppImage on a bare Rocky Linux 9 (no X11, OpenGL or Vulkan)
    needs: linux
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 20
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: text-report-linux
          path: text-report
      # no fonts, fontconfig, X11 or OpenGL installed: the figure text must still render, with the
      # same pixels and metrics as on the build machine (the linux job's report)
      # ... and a video, charts and previews of the demo project rendered there (software 3D
      # renderer, bundled fonts and FFmpeg), the video checked with the AppImage's own probe-video
      - name: Command line on the bare system, with render / charts / preview (the AppImage's fallback libraries stand in)
        run: |
          dnf install -y --setopt=install_weak_deps=False python3 findutils
          chmod +x dist/*.AppImage
          # none of the desktop libraries is installed: the AppImage's copies must stand in
          python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage --version "${{ needs.linux.outputs.version }}" \
            --compare-text-report text-report/text-report.json --screenshot-dir cli-render-rocky \
            --expect-fallback libGL.so.1,libEGL.so.1,libGLX.so.0,libGLdispatch.so.0,libX11.so.6,libxcb.so.1,libfontconfig.so.1,libfreetype.so.6
      # no system fonts either: the interface draws in the bundled IBM Plex fonts (FONT-01)
      - name: Interface under Xvfb, without a Vulkan driver (software view)
        run: |
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          # Xvfb brings libGL, libGLX, libGLdispatch, X11, xcb and freetype but neither libEGL nor
          # fontconfig: the AppImage's whole glvnd set (one unit, as the host lacks a member) and its
          # fontconfig are used, the host's X11, xcb and freetype win
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer software --version "${{ needs.linux.outputs.version }}" \
            --screenshot-dir gui-screenshots \
            --expect-fallback libGL.so.1,libEGL.so.1,libGLX.so.0,libGLdispatch.so.0,libfontconfig.so.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-screenshots-rocky
          path: |
            gui-screenshots
            cli-render-rocky
          if-no-files-found: warn

  windows:
    name: Windows build, tests and installer (MSVC 2022)
    runs-on: windows-2022
    timeout-minutes: 120  # 60 when FFmpeg comes from the cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          python -m pip install "py7zr==$env:PY7ZR_VERSION"
          python tools\get_qt.py --version $env:QT_VERSION --arch win64_msvc2022_64 --out "C:\Qt\$env:QT_VERSION\msvc2022_64" `
            --archive qtbase --archive qtsvg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # video encoding: rebuilt only when packaging/ffmpeg changes (pins, scripts)
      - name: FFmpeg (LGPL) and SVT-AV1 from the cache
        id: ffmpeg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/ffmpeg/prefix
            build/ffmpeg/ffmpeg-*-vcpkg-source.zip
          key: ffmpeg-windows-msvc-${{ hashFiles('packaging/ffmpeg/**') }}

      - name: FFmpeg (LGPL) and SVT-AV1 with vcpkg (packaging/ffmpeg/windows/build_ffmpeg.ps1)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging\ffmpeg\windows\build_ffmpeg.ps1 -Prefix build\ffmpeg\prefix -Work C:\mdbff  # short path: vcpkg's build trees

      # saved right away, so a later failing step does not cost the next run the vcpkg build
      - name: FFmpeg (LGPL) and SVT-AV1 into the cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/ffmpeg/prefix
            build/ffmpeg/ffmpeg-*-vcpkg-source.zip
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Build, tests, zip and installer
        run: |
          $env:MDBRIDGE_GUI_SCREENSHOTS = "$PWD\gui-test-screenshots"  # gui.cases, gui.window (label gui with gui.forms, gui.problems, gui.jobs; offscreen)
          packaging\windows\build_windows.ps1 -QtDir "C:\Qt\$env:QT_VERSION\msvc2022_64" -Out dist -FFmpegRoot build\ffmpeg\prefix

      # the main window as the GUI tests drove it (tests/gui), for review; never compared
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-test-screenshots-windows
          path: gui-test-screenshots
          if-no-files-found: warn

      # Vulkan tests on Mesa's lavapipe, a test-only driver never shipped (owner decision D14;
      # tools/get_lavapipe.py pins the MSYS2 packages by SHA-256); rebuilt only when the pins change
      - name: Lavapipe (Vulkan on the CPU, test-only) from the cache
        id: lavapipe-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: build/lavapipe
          key: lavapipe-windows-${{ hashFiles('tools/get_lavapipe.py') }}

      - name: Lavapipe (tools/get_lavapipe.py)
        if: steps.lavapipe-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "zstandard==0.23.0"
          python tools\get_lavapipe.py --out build\lavapipe --cache "$env:RUNNER_TEMP\lavapipe-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vulkan tests on lavapipe
        env:
          MDBRIDGE_REQUIRE_VULKAN: "1"
        run: |
          $lvp = (Resolve-Path build\lavapipe).Path
          $env:PATH = "$lvp;$env:PATH"  # vulkan-1.dll, used when Windows has no Vulkan loader of its own
          $icd = "$lvp\lvp_icd.x86_64.json"
          # The runner's processes are elevated, and the Vulkan loader ignores VK_DRIVER_FILES and
          # VK_ICD_FILENAMES in elevated processes (it then reads drivers only from HKLM, so the tests
          # saw no driver: VK_ERROR_INCOMPATIBLE_DRIVER). Register lavapipe there for this step only.
          $key = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }  # -Force on an existing key would empty it
          New-ItemProperty -Path $key -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
          $env:VK_DRIVER_FILES = $icd  # for a non-elevated shell (only this driver)
          $env:VK_LOADER_DEBUG = "error,warn"  # why a driver does not load, in a failing test's output
          try {
            ctest --test-dir build\windows\build -C Release -L vulkan --no-tests=error --output-on-failure
            $code = $LASTEXITCODE
          } finally {
            Remove-ItemProperty -Path $key -Name $icd  # the installed program's smoke test runs without it
          }
          if ($code -ne 0) { exit $code }

      - name: Install for the current user, then smoke test the installed program (video, charts, preview, interface, Start-menu entry)
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          $target = "$env:RUNNER_TEMP\MDBridge"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$target" -Wait
          Get-ChildItem "$target\bin" | Select-Object -First 20 Name
          # the Start-menu entry the installer made (per user: the user's Programs folder) and its target
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "MDBridge\MDBridge.lnk"
          if (-not (Test-Path $lnk)) { throw "the installer made no Start-menu entry $lnk" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          "Start-menu entry: $($shortcut.TargetPath) [$($shortcut.Arguments)]"
          if ($shortcut.TargetPath -ne "$target\bin\mdbridge-gui.exe" -or $shortcut.Arguments) {
            throw "the Start-menu entry starts '$($shortcut.TargetPath) $($shortcut.Arguments)'"
          }
          # the entry itself starts the interface (it keeps running until stopped here)
          $before = @(Get-Process mdbridge-gui -ErrorAction SilentlyContinue).Count
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 15
          $started = @(Get-Process mdbridge-gui -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $shortcut.TargetPath })
          if ($started.Count -le $before) { throw "the Start-menu entry did not start MDBridge (or it ended within 15 s)" }
          $started | Stop-Process -Force
          # its target with a project argument (as "Open with" passes a file), and the smoke test
          python packaging\smoke_test.py "$target\bin\mdbridge.exe" --gui --gui-exe $shortcut.TargetPath `
            --screenshot-dir gui-screenshots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # the interface's 3D view and preview, and the command line's preview, for review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gui-screenshots-windows
          path: gui-screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-windows-x64
          path: |
            dist/MDBridge-*-windows-x64.zip
            dist/MDBridge-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-ffmpeg-source-windows
          path: build/ffmpeg/ffmpeg-*-vcpkg-source.zip
          if-no-files-found: error
          compression-level: 0

  parity:
    name: Parity with MDATK v0.0.4.1 (project files, command line)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: MDATK at the frozen tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: htchamblee/MDATK
          ref: v0.0.4.1
          path: mdatk

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist

      - name: Install MDATK
        run: python -m pip install ./mdatk

      - name: Fresh project files written by MDATK read the same in MDBridge
        run: |
          chmod +x dist/*.AppImage
          python tests/parity/make_projects.py work/projects
          (cd work/projects && python ../../tests/parity/reference.py --out ../expected *.toml)
          python tests/parity/compare.py --mdbridge dist/MDBridge-*-x86_64.AppImage --expected work/expected \
            work/projects/*.toml

      - name: The committed references are what MDATK reads from the committed fixtures
        run: |
          (cd tests/data/projects && python ../../parity/reference.py --out ../../../work/committed *)
          diff -r tests/data/expected work/committed

      # the commands of the command line: MDATK in-process with MDAnalysis 2.11.0 and MDBridge's
      # independent data tables patched in (tests/data/README.md), so its dependencies are pinned as
      # in the regenerate job
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: MDATK's dependencies at the reference versions (MDAnalysis 2.11.0, numpy 2.5.5, scipy 1.18.1)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps -r tests/parity/requirements-regenerate.txt

      # the render, charts and preview cases: MDATK's video runs the ffmpeg executable, and both
      # sides' videos are compared by ffprobe's metadata (Ubuntu's package)
      - name: FFmpeg for MDATK's video and ffprobe
        run: |
          # the runner image's packages.microsoft.com source is not used here and its outages (403) fail the update
          { grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null || true; } | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      # GitHub's Ubuntu runners link their Miniconda (/usr/share/miniconda) into /usr/bin: the cases of
      # tests/parity/cli_parity.py without a conda of their own (PATH /usr/bin:/bin) must find none
      - name: No conda on the system PATH
        run: |
          for tool in conda mamba micromamba; do
            if found="$(PATH=/usr/bin:/bin command -v "$tool")"; then ls -l "$found"; sudo rm -f "$found"; fi
          done
          if PATH=/usr/bin:/bin command -v conda mamba micromamba; then exit 1; fi

      - name: init, info, list, analyze, export-pdb, render, charts, preview and density info print and write what MDATK prints and writes
        run: |
          (cd work && ../dist/MDBridge-*-x86_64.AppImage --appimage-extract > /dev/null)  # once, not per run
          "$RUNNER_TEMP/venv/bin/python" -I -B tests/parity/cli_parity.py --mdatk mdatk \
            --mdbridge work/squashfs-root/AppRun
          test -z "$(git -C mdatk status --porcelain)"  # nothing was written into the checkout

  regenerate:
    name: Committed test data is what MDATK v0.0.4.1 and MDAnalysis 2.11.0 produce
    # every generator of tests/data/README.md (tests/parity/*.py, tools/gen_*.py) runs into a fresh
    # tree, which must equal the committed files byte for byte (one CPU-dependent file within a
    # tolerance: see the script); no build needed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: MDATK at the frozen tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: htchamblee/MDATK
          ref: v0.0.4.1
          path: mdatk

      # project files of a later MDATK for the round-trip tests (D9): 0.1.1, main after its version
      # commit (no tag); tests/parity/regenerate_all.py LATEST_COMMIT
      - name: MDATK 0.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: htchamblee/MDATK
          ref: 1efa0ef44e9cb0d04b9c04a409919f7913f59fdb
          path: mdatk-latest

      # Python 3.13: textwrap, json's messages and the Unicode tables depend on the version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: MDATK's dependencies at the reference versions (MDAnalysis 2.11.0, numpy 2.5.5, scipy 1.18.1) and pytest
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps -r tests/parity/requirements-regenerate.txt

      # MDATK's render / video commands (tests/parity/make_render_cli_cases.py) run the ffmpeg
      # executable and the generator reads the videos' metadata with ffprobe (Ubuntu's package);
      # MDATK's GTK 3 window (tests/parity/make_gui_cases.py) needs GTK 3's introspection data and
      # Xvfb, and PyGObject / pycairo built for this Python 3.13 (Ubuntu's python3-gi is for its
      # own 3.12): built from the pinned sources against the system's GTK
      - name: FFmpeg for MDATK's video; GTK 3, Xvfb, PyGObject and pycairo for MDATK's window
        run: |
          # the runner image's packages.microsoft.com source is not used here and its outages (403) fail the update
          { grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null || true; } | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth gir1.2-gtk-3.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config
          # the venv is not activated: meson-python runs "meson" (and meson "ninja") from PATH;
          # pycairo first, since PyGObject's build needs its installed header (pip builds every
          # wheel of one call before installing any)
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps -r tests/parity/requirements-gui-build.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps --no-build-isolation \
            -c tests/parity/requirements-gui.txt pycairo
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps --no-build-isolation -r tests/parity/requirements-gui.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze
          ffmpeg -version | head -n 1

      # GitHub's Ubuntu runners link their Miniconda (/usr/share/miniconda) into /usr/bin: the cases of
      # tests/parity/cli_parity.py without a conda of their own (PATH /usr/bin:/bin) must find none
      - name: No conda on the system PATH
        run: |
          for tool in conda mamba micromamba; do
            if found="$(PATH=/usr/bin:/bin command -v "$tool")"; then ls -l "$found"; sudo rm -f "$found"; fi
          done
          if PATH=/usr/bin:/bin command -v conda mamba micromamba; then exit 1; fi

      - name: Regenerate every data set and compare with the committed files
        run: |
          # one interpreter for every step: MDAnalysis, numpy and scipy (also for the MDATK 0.1.1 steps
          # mdatk_latest and edit_model, whose density checks import scipy), pytest, PyGObject / pycairo
          venv="$RUNNER_TEMP/venv/bin/python"
          python tests/parity/regenerate_all.py --mdatk mdatk --mdatk-latest mdatk-latest \
            --out "$RUNNER_TEMP/fresh" --python "$venv" --pytest-python "$venv" --gui-python "$venv"
          test -z "$(git -C mdatk status --porcelain)"  # nothing was written into the checkouts
          test -z "$(git -C mdatk-latest status --porcelain)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: regenerated-test-data
          path: |
            ${{ runner.temp }}/fresh/tests/data
            ${{ runner.temp }}/fresh/src
            ${{ runner.temp }}/fresh/logs
          if-no-files-found: ignore

  release:
    name: GitHub release
    # tags only, and only when every build and test passed: no half-empty releases
    needs: [linux, sanitizers, appimage-ubuntu, appimage-rocky, windows, parity, regenerate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mdbridge-*
          path: release
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd release
          ls -l
          sha256sum MDBridge-* ffmpeg-* > SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## MDBridge ${version}"
            echo
            echo "Nothing to install besides the program itself: no Python, conda or virtual environment."
            echo
            echo "**Linux** (x86-64; RHEL / Rocky / Alma 9, Ubuntu 22.04 or newer): \`MDBridge-${version}-x86_64.AppImage\`"
            echo '```'
            echo "chmod +x MDBridge-${version}-x86_64.AppImage"
            echo "./MDBridge-${version}-x86_64.AppImage            # the interface"
            echo "./MDBridge-${version}-x86_64.AppImage --help     # the command line"
            echo '```'
            echo
            echo "**Windows 10/11 x64**: \`MDBridge-${version}-windows-x64-setup.exe\` (installs for the current user,"
            echo "no administrator rights needed) or \`MDBridge-${version}-windows-x64.zip\` (unzip, run \`bin\\mdbridge-gui.exe\`)."
            echo
            echo "The 3D view uses Vulkan 1.3 where the graphics driver offers it, otherwise a software view."
            echo "MDBridge opens MDATK 0.0.4.1 project files (\`.mdatk.toml\`)."
            echo
            echo "Licence: all rights reserved (no licence granted yet). Bundled third-party software and its"
            echo "licences: \`THIRD_PARTY_NOTICES\` and the \`licenses\` folder of each build. Checksums: \`SHA256SUMS.txt\`."
            echo
            echo "Video encoding uses FFmpeg's libraries (LGPL 2.1 or later) with SVT-AV1 (BSD). The corresponding"
            echo "FFmpeg source: \`ffmpeg-*-source.tar.xz\` (Linux build) and \`ffmpeg-*-vcpkg-source.zip\` (Windows build)."
          } > ../release_notes.md
          cat ../release_notes.md

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: release_notes.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
