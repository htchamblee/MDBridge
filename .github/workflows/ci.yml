# Build, test and package MDBridge: Linux AppImage and Windows installer, on every push.
#
# - linux:       build and unit tests on Rocky Linux 9 (the oldest supported glibc), AppImage,
#                glibc check, smoke test with the Vulkan view (lavapipe) and the software view
# - appimage-*:  the AppImage on Ubuntu 22.04 (with Vulkan) and on a bare Rocky Linux 9 (command
#                line without X11 / OpenGL, then the interface without a Vulkan driver)
# - windows:     MSVC 2022 build and tests, zip and installer; smoke test of the installed program
# - parity:      MDATK v0.0.4.1 writes project files and records what it reads from them;
#                the AppImage must read them the same way
# - release:     tags v* only, after every job passed: attaches the builds to the GitHub release
#
# Local builds: docs/BUILDING.md. The actions are pinned to commit SHAs (versions in comments).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: "6.11.3"
  PY7ZR_VERSION: "1.1.4"  # unpacks Qt's archives (tools/get_qt.py)

jobs:
  linux:
    name: Linux build, tests and AppImage (Rocky Linux 9)
    # glibc 2.34 (RHEL 9) is the oldest the AppImage supports, so it is built there; Qt 6.11's
    # official binaries are built on RHEL 9 with GCC 11 too
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System packages (compiler, build tools, OpenGL headers and Qt's X11 libraries, lavapipe and Xvfb)
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ cmake ninja-build git file binutils findutils which tar xz \
            python3.12 python3.12-pip libglvnd-devel mesa-libGL-devel \
            libX11-xcb libxkbcommon libxkbcommon-x11 xcb-util xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil fontconfig dejavu-sans-fonts dbus-libs \
            libglvnd-egl libglvnd-glx libglvnd-opengl mesa-libGL mesa-libEGL \
            vulkan-loader mesa-vulkan-drivers xorg-x11-server-Xvfb xorg-x11-xauth
          g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          python3.12 -m pip install "py7zr==$PY7ZR_VERSION"
          python3.12 tools/get_qt.py --version "$QT_VERSION" --arch linux_gcc_64 --out "/opt/Qt/$QT_VERSION/gcc_64" \
            --archive qtbase --archive icu
          echo "QT_DIR=/opt/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DMDBRIDGE_WARNINGS_AS_ERRORS=ON
          cmake --build build/release

      - name: Unit tests
        run: ctest --test-dir build/release --output-on-failure

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt)"
          echo "MDBridge $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $version (CMakeLists.txt)"
            exit 1
          fi

      - name: AppImage
        run: packaging/linux/build_appimage.sh --build build/release --out dist

      - name: glibc check (at most 2.34, RHEL 9)
        run: packaging/linux/check_glibc.sh build/appimage/AppDir 2.34

      - name: Smoke test (Vulkan view on lavapipe, software view, project files)
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python3.12 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer vulkan --version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist/MDBridge-*-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0  # already compressed

  appimage-ubuntu:
    name: AppImage on Ubuntu 22.04 (Vulkan)
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist
      - name: Xvfb and a Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer vulkan --version "${{ needs.linux.outputs.version }}"

  appimage-rocky:
    name: AppImage on a bare Rocky Linux 9 (no X11, OpenGL or Vulkan)
    needs: linux
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 20
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist
      - name: Command line on the bare system (the AppImage's fallback libraries stand in)
        run: |
          dnf install -y --setopt=install_weak_deps=False python3 findutils
          chmod +x dist/*.AppImage
          python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage --version "${{ needs.linux.outputs.version }}"
      - name: Interface under Xvfb, without a Vulkan driver (software view)
        run: |
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/smoke_test.py dist/MDBridge-*-x86_64.AppImage \
            --gui --expect-renderer software --version "${{ needs.linux.outputs.version }}"

  windows:
    name: Windows build, tests and installer (MSVC 2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Qt ${{ env.QT_VERSION }}
        run: |
          python -m pip install "py7zr==$env:PY7ZR_VERSION"
          python tools\get_qt.py --version $env:QT_VERSION --arch win64_msvc2022_64 --out "C:\Qt\$env:QT_VERSION\msvc2022_64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build, tests, zip and installer
        run: packaging\windows\build_windows.ps1 -QtDir "C:\Qt\$env:QT_VERSION\msvc2022_64" -Out dist

      - name: Install for the current user, then smoke test the installed program
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          $target = "$env:RUNNER_TEMP\MDBridge"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$target" -Wait
          Get-ChildItem "$target\bin" | Select-Object -First 20 Name
          python packaging\smoke_test.py "$target\bin\mdbridge.exe" --gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdbridge-windows-x64
          path: |
            dist/MDBridge-*-windows-x64.zip
            dist/MDBridge-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  parity:
    name: Parity with MDATK v0.0.4.1 (project files)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: MDATK at the frozen tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: htchamblee/MDATK
          ref: v0.0.4.1
          path: mdatk

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdbridge-linux-x86_64
          path: dist

      - name: Install MDATK
        run: python -m pip install ./mdatk

      - name: Fresh project files written by MDATK read the same in MDBridge
        run: |
          chmod +x dist/*.AppImage
          python tests/parity/make_projects.py work/projects
          (cd work/projects && python ../../tests/parity/reference.py --out ../expected *.toml)
          python tests/parity/compare.py --mdbridge dist/MDBridge-*-x86_64.AppImage --expected work/expected \
            work/projects/*.toml

      - name: The committed references are what MDATK reads from the committed fixtures
        run: |
          (cd tests/data/projects && python ../../parity/reference.py --out ../../../work/committed *)
          diff -r tests/data/expected work/committed

  release:
    name: GitHub release
    # tags only, and only when every build and test passed: no half-empty releases
    needs: [linux, appimage-ubuntu, appimage-rocky, windows, parity]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mdbridge-*
          path: release
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd release
          ls -l
          sha256sum MDBridge-* > SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## MDBridge ${version}"
            echo
            echo "Nothing to install besides the program itself: no Python, conda or virtual environment."
            echo
            echo "**Linux** (x86-64; RHEL / Rocky / Alma 9, Ubuntu 22.04 or newer): \`MDBridge-${version}-x86_64.AppImage\`"
            echo '```'
            echo "chmod +x MDBridge-${version}-x86_64.AppImage"
            echo "./MDBridge-${version}-x86_64.AppImage            # the interface"
            echo "./MDBridge-${version}-x86_64.AppImage --help     # the command line"
            echo '```'
            echo
            echo "**Windows 10/11 x64**: \`MDBridge-${version}-windows-x64-setup.exe\` (installs for the current user,"
            echo "no administrator rights needed) or \`MDBridge-${version}-windows-x64.zip\` (unzip, run \`bin\\mdbridge-gui.exe\`)."
            echo
            echo "The 3D view uses Vulkan 1.3 where the graphics driver offers it, otherwise a software view."
            echo "MDBridge opens MDATK 0.0.4.1 project files (\`.mdatk.toml\`)."
            echo
            echo "Licence: all rights reserved (no licence granted yet). Bundled third-party software and its"
            echo "licences: \`THIRD_PARTY_NOTICES\` and the \`licenses\` folder of each build. Checksums: \`SHA256SUMS.txt\`."
          } > ../release_notes.md
          cat ../release_notes.md

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: release_notes.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
