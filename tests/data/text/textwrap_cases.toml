lines = ["Inter-group hydrogen bonds from basic geometric criteria.", "", "A hydrogen bond is counted for every (H, acceptor) pair where the donor heavy", "atom D and acceptor A are within ``distance_cutoff`` and, when angles are", "enabled, the D-H...A angle is at least ``angle_cutoff``.  Donor hydrogens are", "taken from the topology's bonds; when the topology has no bonds they are", "assigned from distances on the first analysed frame.  Topologies without", "hydrogens fall back to donor-acceptor distances only."]

