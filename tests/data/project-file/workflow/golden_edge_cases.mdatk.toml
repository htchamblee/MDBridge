# Molecular Dynamic Analysis Tool Kit (MDATK) project file.
# Plain TOML: every entry is explained by the comment above it. Edit with care; MDATK rewrites this
# file (keeping the step log) when the project is saved.

# File type marker of an MDATK project; do not change.
format = "mdatk-project"
# Version of the project file layout.
format_version = 1
# Molecular Dynamic Analysis Tool Kit (MDATK) version that wrote this file.
mdatk_version = "0.0.4.1"
# When the settings were last saved.
saved = 2026-10-15T14:32:00
# File next to the project that holds its step log ("": the log is at the end of this file; it moves
# out once the project file would grow too large).
log_file = ""
# Free-text notes about the project (what, why, decisions, to-dos)
notes = ""

# Input files and frame range
[inputs]
# Topology: Amber .parm7 / .prmtop (preferred), PDB, PSF, GRO, ...
topology = ""
# Trajectory files in order; several files are concatenated
trajectories = []
# First analysed frame (0-based; of the cleaned trajectory when cleaning is on)
start = 0
# Stop before this frame (0-based, exclusive; not set: up to the last frame)
# stop =   (not set)
# Analyse every n-th frame
step = 1
# Time between stored frames in ps (not set: from the trajectory's time stamps)
# dt_ps =   (not set)
# Unit shown on time axes: "ps", "ns", "us" or "frame"
time_unit = "ns"
# External data files shown as extra traces (interpolated onto the analysed frames)
external = []

# Trajectory cleaning with cpptraj
[cleaning]
# Strip, image and fit the trajectory with cpptraj before the analyses
enabled = false
# cpptraj executable: a name on PATH or an absolute path
cpptraj_path = "cpptraj"
# Conda environment providing cpptraj (a name such as AmberTools26 or a prefix path); every call
# runs through 'conda run -n <env>'
conda_env = ""
# conda / mamba / micromamba executable ("": found automatically)
conda_exe = ""
# cpptraj mask of the solvent residues to strip
solvent_mask = ":WAT,HOH,TIP3,SOL,T3P,T4P,SPC"
# cpptraj mask of the ions to strip (Mg2+ is kept by default)
ion_mask = ":Na+,Cl-,K+,NA,CL,K,Na,Cl,SOD,CLA,POT"
# Further atoms to strip (cpptraj mask; optional)
extra_strip_mask = ""
# Re-image molecules into the primary box (cpptraj autoimage)
autoimage = true
# Anchor mask for autoimage ("": cpptraj's default, the first molecule)
autoimage_anchor = ""
# RMS-fit every frame onto the reference
fit = true
# cpptraj mask of the atoms used for the RMS fit
fit_mask = "@P,C4'"
# Fit reference: the "first" frame, a given "frame" number or a "file"
fit_reference = "first"
# Remove the box after fitting (a rotated box cannot be stored in NetCDF)
remove_box_after_fit = true
# Reference frame for fit_reference = "frame" (1-based, cpptraj convention)
reference_frame = 1
# Reference structure for fit_reference = "file"
reference_file = ""
# First frame read by cpptraj (1-based trajin argument)
start = 1
# Last frame read by cpptraj (1-based, inclusive; not set: the last frame)
# stop =   (not set)
# Read every n-th frame (cpptraj trajin offset)
offset = 1
# Advanced: cpptraj commands inserted before trajout
extra_commands = ""
# Folder for the cleaned files ("": <cache_dir>/cleaned)
output_dir = ""

# Analyses
[analyses]
# Minimum-image distances (cleaned, imaged systems rarely need it)
use_pbc = false
# Largest proximity cutoff usable later without re-analysing (Å)
proximity_search_radius = 8.0

# RMSD time series
[analyses.rmsd]
# Compute RMSD time series
enabled = true
# Reference structure: index into the analysed frames (0: the first)
reference_frame = 0
# Superpose each frame onto the reference before computing the RMSD
superposition = true
# Mass-weighted superposition and RMSD
mass_weighted = false

# One RMSD series per target
[[analyses.rmsd.targets]]
# Name of the series (data key rmsd/<label>)
label = "Complex"
# Atoms whose RMSD is computed (selection; group:<name> allowed)
selection = "(group:Aptamer or group:Target) and not name H*"
# Atoms superposed before computing the RMSD ("": the same atoms)
fit_selection = ""

[[analyses.rmsd.targets]]
# Name of the series (data key rmsd/<label>)
label = "Backbone"
# Atoms whose RMSD is computed (selection; group:<name> allowed)
selection = "(group:Aptamer or group:Target) and name C4'"
# Atoms superposed before computing the RMSD ("": the same atoms)
fit_selection = ""

# Heavy-atom contacts between two groups
[analyses.contacts]
# Count heavy-atom contacts between two groups
enabled = true
# First residue group
group_a = "Aptamer"
# Second residue group
group_b = "Target"
# Contact distance cutoff (Å)
cutoff = 4.5
# Ignore hydrogens
heavy_only = true

# Hydrogen bonds between two groups
[analyses.hbonds]
# Count hydrogen bonds between two groups
enabled = true
# First residue group
group_a = "Aptamer"
# Second residue group
group_b = "Target"
# Maximum donor-acceptor distance (Å)
distance_cutoff = 3.5
# Also require a minimum D-H...A angle (needs hydrogens in the topology)
use_angle = true
# Minimum D-H...A angle (degrees)
angle_cutoff = 135.0
# Elements that can donate (comma separated)
donor_elements = "N,O"
# Elements that can accept (comma separated)
acceptor_elements = "N,O"

# Mg2+ coordination, bridges and occupancy
[analyses.mg]
# Analyse Mg2+ coordination: inner/outer-sphere contacts, bridges and occupancy
enabled = true
# Selection of the Mg2+ ions
mg_selection = "resname MG Mg MG2 or name MG Mg"
# Atoms that can coordinate Mg2+
ligand_selection = "group:Aptamer or group:Target"
# Elements of the coordinating atoms (comma separated)
ligand_elements = "O"
# First group of a Mg2+ bridge
group_a = "Aptamer"
# Second group of a Mg2+ bridge
group_b = "Target"
# Inner-sphere Mg-O distance cutoff (Å)
inner_cutoff = 2.6
# Outer-sphere (water-mediated) Mg-O distance cutoff (Å)
outer_cutoff = 4.5
# Shell that counts as a bridge: "inner" or "outer"
bridge_shell = "inner"
# Require octahedral O-Mg-O angles (about 90 or 180 degrees)
geometry = false
# Allowed deviation from the octahedral angles (degrees)
angle_tolerance = 25.0
# Atoms whose Mg2+ occupancy is reported ("": the ligand selection)
occupancy_selection = ""
# Elements counted for the occupancy (comma separated)
occupancy_elements = "N,O"

# Base stacking
[analyses.stacking]
# Detect base stacking from ring geometry
enabled = true
# Residues whose rings are considered
selection = "group:Aptamer or group:Target"
# "all" ring pairs, or "inter" (group A against group B only)
scope = "all"
# First group for scope = "inter"
group_a = "Aptamer"
# Second group for scope = "inter"
group_b = "Target"
# Maximum ring-centroid distance (Å)
distance_cutoff = 4.5
# Maximum angle between the ring normals (degrees)
angle_cutoff = 30.0
# Maximum lateral displacement of the centroids (Å)
offset_cutoff = 2.5
# Maximum RMS deviation of ring atoms from their plane (Å)
planarity_cutoff = 0.25

# Non-bonded interaction energy
[analyses.energy]
# Non-bonded interaction energy between two groups
enabled = true
# First residue group
group_a = "Aptamer"
# Second residue group
group_b = "Target"
# Pair distance cutoff (Å)
cutoff = 12.0
# Relative dielectric constant
dielectric = 1.0
# Distance-dependent dielectric (epsilon = dielectric x r)
distance_dependent = false
# Use the exact Lennard-Jones parameters of a parm7 topology
use_parm7 = true
# Reference energy drawn on charts and panels (kcal/mol; not set: none)
# target_value =   (not set)
# Exclude pairs within n bonds (0: exclude none)
exclude_bonded = 3

# Base pairs (secondary structure)
[analyses.basepairs]
# Base pairs of the residues in the structure view, for the secondary-structure panel and PDB
# annotation; computed whenever a panel needs them. Engine: "builtin" (canonical pairs from H-bond
# geometry) or "barnaba" (optional)
engine = "builtin"
# Re-detect the pairs every n-th analysed frame (pairs hold in between)
stride = 10
# Builtin: maximum donor-acceptor distance of a base-pair H-bond (Å)
cutoff = 3.5
# Builtin: also count G-U wobble pairs
wobble = true
# Barnaba: also keep non-canonical (non Watson-Crick) pairs
noncanonical = false

# Structure view: colouring, glow, 3D representations, labels
[visual]
# Residue groups shown in the structure view (empty: all)
structure_groups = []
# Atom used for each residue's 2D trace point, first one found wins (P, C4', C1', CA ...)
trace_atoms = "C4',CA"
# 3D representations (empty: the 2D backbone trace)
representations = []
# 3D renderer: "auto" / "software" (built-in) or "vtk" (optional)
renderer = "auto"
# Residues no representation draws: "trace" (3D trace) or "hide"
rep_rest = "trace"
# Spline control atom of ribbons, cartoons and traces: "P" or "C4'"
backbone_atom = "P"
# Include hydrogens in all-atom representations
rep_hydrogens = false
# Show Mg2+ ions in the structure view
show_ions = true
# Superpose each frame's trace onto the reference frame
align_frames = true
# View rotation in degrees about X, Y and Z (R = Rz Ry Rx)
rotation = [0.0, 0.0, 0.0]
# Magnification of the structure view (1: the whole model fits; 2: twice as large)
zoom = 1.0
# View centre: "" (centre of the model), "origin" (0, 0, 0 of the coordinates) or a residue, e.g.
# "12" or "B:12"
center_on = ""
# Keep the centre residue in the middle in every frame (not only the first)
center_follow = false
# Residue colouring: "chain", "groups" or "proximity"
color_mode = "groups"
# Colour of residues no group or proximity colour applies to
base_color = "#b5b3ad"
# Matplotlib palette for chain colouring
chain_palette = "tab10"
# Group (or sel:<selection>) whose proximity colours and glows residues
proximity_set = "Target"
# Distance that counts as proximity (Å)
proximity_cutoff = 4.0
# Colour of residues in proximity
proximity_color = "#e34948"
# Glow of residues near the proximity set: "none", "ever" (whole movie), "fade" or "current"
glow_mode = "fade"
# Glow colour
glow_color = "#ffb000"
# Frames over which the glow fades (glow_mode = "fade")
fade_frames = 15
# Glow intensity factor
glow_strength = 1.0
# Colour of Mg2+ ions
ion_color = "#008300"
# Line width of the 2D trace (points)
line_width = 2.2
# Marker size of the 2D trace points
point_size = 22.0
# Fade distant parts toward the background colour
depth_cue = true
# "light" or "dark"
theme = "light"
# Base font size (points)
font_size = 11.0
# Show the time label in the structure view
show_time_label = true
# Residue-number tags on every n-th residue (0: off)
label_every = 0
# Explicit residue numbers / ranges to tag, e.g. "1, 12, 24"
label_residues = ""
# Figure title ("": none)
title = ""

# Density map shadow and fit
[density]
# Density map file (.mrc / .map / .ccp4)
map_path = ""
# Draw the map shadow
show = true
# Resolution in Å; width of the simulated map used for fitting
resolution = 5.0
# Contour level in map standard deviations above the mean
level = 2.0
# Shadow colour
color = "#2a78d6"
# Shadow opacity, 0 (invisible) to 1
opacity = 0.45
# Draw the shadow in front of 3D representations (else behind them)
front = false
# "ref" (the first analysed frame) or a trajectory frame number to fit on
fit_frame = "ref"
# Automatic fit: "global" search or "manual" (refine the stored placement)
search = "global"
# Degrees between sampled orientations of the global search
angular_step = 30.0
# Fit before rendering when no placement is stored
auto_fit = true
# Placement: 3x3 rotation (row-major) + translation, model -> map
transform = []
# Backbone points of the reference frame the placement was made on (the map follows the molecule
# when the reference changes: other start frame, cleaned vs raw files)
anchor = []
# Correlation of the stored placement (0: not fitted)
fit_cc = 0.0
# Summary of the last fit
fit_info = ""

# Figure layout: grid and panels
[layout]
# Grid layout (see 'mdatk list')
preset = "large_plus_3"

# Panels in slot order
[[layout.panels]]
# Panel type: structure, timeseries, dual_axis, heatmap or contact_map
type = "structure"
# Data keys shown, e.g. rmsd/Complex or contacts/per_residue_a
series = []
# Panel title ("": automatic)
title = "Structure"
# Panel-specific options, e.g. axis limits or the contact-map mode
options = {}

[[layout.panels]]
# Panel type: structure, timeseries, dual_axis, heatmap or contact_map
type = "timeseries"
# Data keys shown, e.g. rmsd/Complex or contacts/per_residue_a
series = ["rmsd/Complex"]
# Panel title ("": automatic)
title = "RMSD"
# Panel-specific options, e.g. axis limits or the contact-map mode
options = {}

[[layout.panels]]
# Panel type: structure, timeseries, dual_axis, heatmap or contact_map
type = "timeseries"
# Data keys shown, e.g. rmsd/Complex or contacts/per_residue_a
series = ["hbonds/count"]
# Panel title ("": automatic)
title = "Inter-strand H-bonds"
# Panel-specific options, e.g. axis limits or the contact-map mode
options = {}

[[layout.panels]]
# Panel type: structure, timeseries, dual_axis, heatmap or contact_map
type = "contact_map"
# Data keys shown, e.g. rmsd/Complex or contacts/per_residue_a
series = ["contacts/map"]
# Panel title ("": automatic)
title = ""

# Panel-specific options, e.g. axis limits or the contact-map mode
[layout.panels.options]
# Contact map: 'instant' (evolves with the movie), 'frame' (one fixed frame) or 'frequency'
# (fraction of frames in contact).
mode = "instant"
# Contact map: true puts the first group (e.g. the aptamer) along x and the second along y.
transpose = true

# Outputs: folders, video, charts, PDB frames
[output]
# Output folder (a relative path is relative to the project file)
out_dir = "MDATK_output"
# Cache of analyses and cleaned trajectories ("": <out_dir>/MDATK_cache)
cache_dir = ""
# Write MDATK_params_log.toml (settings, versions, cache keys, citations) next to the outputs
write_params_log = true
# Time-stamp output file names, e.g. MDATK_video_2026-10-15_143205.mp4 (cache and log keep fixed
# names)
timestamp_files = true

# MP4 video
[output.video]
# Write the MP4 video
enabled = true
# Video file name (time-stamped when output.timestamp_files is on)
filename = "MDATK_video.mp4"
# Frames per second
fps = 24
# Width in pixels
width = 1920
# Height in pixels
height = 1080
# Figure resolution; sets text and line sizes relative to the frame
dpi = 120
# FFmpeg video codec
codec = "libx264"
# Constant rate factor: lower means better quality and larger files (libx264: 18-28)
crf = 20
# Use every n-th analysed frame
frame_stride = 1
# FFmpeg executable
ffmpeg_path = "ffmpeg"

# Time charts
[output.charts]
# Write high-resolution time charts
enabled = true
# Data keys to chart (empty: every scalar series)
series = []
# Also chart per-residue heatmaps
include_heatmaps = false
# File formats, e.g. png, pdf, svg
formats = ["png"]
# Raster resolution
dpi = 300
# Width in inches
width = 8.0
# Height in inches
height = 4.5
# "mdatk" (built-in look) or any matplotlib style name
style = "mdatk"
# Line colour ("": the first palette colour)
color = ""
# Line width (points)
line_width = 1.5
# Chart title ("": the series label; "{label}" placeholders allowed)
title = ""
# x-axis label ("": automatic)
xlabel = ""
# y-axis label ("": automatic)
ylabel = ""
# Running-average window in frames (0: off)
smoothing = 0
# Draw the energy target value when one is set
show_target = true
# File name prefix
prefix = "MDATK_chart"

# PDB export of selected frames
[output.pdb]
# Export selected frames as PDB files
enabled = false
# Frames to export, e.g. "0, 10, 20-50:10, last"
frames = ""
# Times to export, e.g. "1.5ns, 2000ps" (no unit: inputs.time_unit)
times = ""
# Group names (comma separated) or a selection ("": everything)
selection = ""
# File name prefix
prefix = "MDATK_frame"

# Project Planner and script wizard
[workflow]
# Project name used in every generated file name
project_name = "edge cases"
# Time stamp in generated file names (fixed once files are written)
stamp = ""
# Put the time stamp into file names
use_stamp = true
# Folder of the generated files ("": <output.out_dir>/<project_name>_workflow)
out_dir = ""
# One sub-folder per step, e.g. 03_amber-build/
step_folders = true
# Stand-alone script wizard settings, one entry per step type
scratch = []

# Planner steps
[[workflow.nodes]]
# Unique id of the step
id = "n1"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "amber-md"
# Step number; orders the steps and their file names
step = 1
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# Amber version: Version the files target (local Amber 26 or cluster Amber 24); the input format is
# the same, the version is recorded in the scripts. Choices: 26, 24.
amber_version = "26"
# MD engine: Program for the MD stages. Choices: pmemd.cuda, pmemd, pmemd.MPI.
engine = "pmemd.MPI"
# MPI processes: Processes for pmemd.MPI.
nproc = 4
# MPI launcher: Command placed before pmemd.MPI; {n} is replaced by the process count (srun on SLURM
# clusters).
mpi_launcher = "mpirun -np {n}"
# Minimisation engine: pmemd.cuda can stop on bad initial contacts; the CPU pmemd is more forgiving.
# Choices: same, pmemd.
min_engine = "same"
# Input coordinates have velocities: Tick when the starting rst7 is a restart of an earlier MD run,
# so the first MD stage can continue it (irest=1).
input_velocities = false
# Positional restraint reference: Coordinates used as -ref for positional restraints. Choices:
# previous, initial.
restraint_ref = "previous"
# Separate production script: Production stages go into their own script (e.g. to run them on a
# cluster).
separate_production = true
# Skip finished stages: When the script is re-run, stages whose output file already has pmemd's
# final timing lines are skipped (resumes an interrupted run).
resume = true
# Dry PDB before production: cpptraj strips water and ions from the last restart of the main script
# (before the production script) - for a visual check of the equilibrated structure.
dry_pdb = true
# Strip mask: cpptraj mask of atoms removed in the dry PDB / trajectory.
strip_mask = ":WAT,HOH,Na+,Cl-,K+,MG"
# Dry, imaged production trajectory: cpptraj autoimage + strip of the production trajectories (and
# the matching dry topology) for visualisation.
dry_traj = false
# Strip mask (trajectory): cpptraj mask removed from the dry trajectory.
dry_mask = ":WAT,HOH,Na+,Cl-,K+,MG"
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""
stale_key = 1

# Stages run in order; each starts from the previous stage's restart file.
[[workflow.nodes.settings.stages]]
name = "min1"
title = "Minimize water/ions, RNA restrained"
kind = "min"
maxcyc = 2000
ncyc = 500
ntmin = "1"
nstlim = 50000
dt = 0.002
restart = "auto"
ensemble = "nvt"
thermostat = "langevin"
gamma_ln = 1.0
tautp = 1.0
vrand = 1000
tempi = 0.0
temp0 = 300.0
ramp = false
ramp_steps = 20000
barostat = "berendsen"
pres0 = 1.0
taup = 1.0
mcbarint = 100
ntp = "1"
shake = true
cut = 10.0
posres = true
posres_mask = ""
posres_wt = 10.0
distres = false
listout = false
ntpr = 100
ntwx = 500
ntwr = 5000
netcdf = true
iwrap = false
segments = 1
production = false
extra_cntrl = ""
extra_namelists = ""

[[workflow.nodes.settings.stages]]
name = "min2"
title = "Unrestrained min, helix pairs held"
kind = "min"
maxcyc = 2000
ncyc = 500
ntmin = "1"
nstlim = 50000
dt = 0.002
restart = "auto"
ensemble = "nvt"
thermostat = "langevin"
gamma_ln = 1.0
tautp = 1.0
vrand = 1000
tempi = 0.0
temp0 = 300.0
ramp = false
ramp_steps = 20000
barostat = "berendsen"
pres0 = 1.0
taup = 1.0
mcbarint = 100
ntp = "1"
shake = true
cut = 10.0
posres = false
posres_mask = ""
posres_wt = 10.0
distres = true
listout = false
ntpr = 100
ntwx = 500
ntwr = 5000
netcdf = true
iwrap = false
segments = 1
production = false
extra_cntrl = ""
extra_namelists = ""
stray = "x"

# Hand-picked input files for ports that no connection feeds ({port = path})
[workflow.nodes.files]
# File chosen by hand for the step's 'topology' input (paths relative to this file; ';' separates
# several).
topology = "a.parm7; b.parm7"

[[workflow.nodes]]
# Unique id of the step
id = "n2"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "gromacs"
# Step number; orders the steps and their file names
step = 2
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# GROMACS version: 2024+ on the workstation, 2023.3 on the cluster (loaded as a module). Choices:
# 2024, 2023.
gmx_version = "2024"
# Module to load: 'module load' line for the cluster version (empty: none).
module = "GROMACS/2023.3-CUDA-11.8.0"
# gmx executable: gmx, gmx_mpi or a full path.
gmx = "gmx"
# Convert Amber files with: ParmEd keeps off-diagonal Lennard-Jones pairs (NBfix) as [
# nonbond_params ]; acpype is an alternative; 'none' uses GROMACS files as they are. Choices:
# parmed, acpype, none.
convert = "parmed"
# Hydrogen mass repartitioning (mdp): mass-repartition-factor = 3 in every mdp (GROMACS 2024+ only)
# so dt = 0.004 ps works with constraints = h-bonds. Not needed when the Amber topology already has
# HMR.
mass_repartition = false
# Restraint force constant: kJ/mol/nm² for stages with RNA position restraints.
posres_fc = 1000.0
# Allow losing NBfix pairs: Normally the conversion stops when the Amber topology has off-diagonal
# LJ pairs that do not appear in the GROMACS topology.
allow_nbfix_loss = false
# Each stage starts from the previous stage's coordinates and checkpoint.
stages = []
# Offload to the GPU: -nb gpu -pme gpu -bonded gpu
gpu = true
# Update on the GPU (-update gpu): Fastest on one GPU; not available with every setting.
update_gpu = false
# OpenMP threads (-ntomp): 0: let GROMACS decide.
ntomp = 0
# grompp -maxwarn: Number of grompp warnings to accept.
maxwarn = 0
# Extra mdrun flags
extra_mdrun = ""
# Separate production script: Production stages go into their own script.
separate_production = true
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""

[[workflow.nodes]]
# Unique id of the step
id = "zz"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "does-not-exist"
# Step number; orders the steps and their file names
step = 9
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
a = 1

[workflow.nodes.settings.nested]
b = 2

[[workflow.nodes]]
# Unique id of the step
id = "raw"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "vmd"
# Step number; orders the steps and their file names
step = 3
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# RNA style: Representation of every residue group. Choices: NewCartoon, Licorice, Ribbons, Tube,
# Surf, QuickSurf, VDW, CPK, Lines.
rna_style = "Tube"
dt = 2

[[workflow.nodes]]
# Unique id of the step
id = "empty"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "note"
# Step number; orders the steps and their file names
step = 0
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# The step's options (each one is explained by its comment)
settings = {}
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

[[workflow.nodes]]
# Unique id of the step
id = "n6"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "input-file"
# Step number; orders the steps and their file names
step = 0
# Box title ("": the step type's label)
title = "Map"
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# File: The existing file. Relative paths are read from the folder of the saved preset.
path = "maps/x.mrc"
# Type: What the file contains; decides which inputs it can feed. Choices: pdb, fasta, secstruct,
# map, cif, smiles, silent, parm7, rst7, nc, dist, top, gro, xtc, trafl, image, text.
kind = "map"

[[workflow.nodes]]
# Unique id of the step
id = "n7"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "mdatk"
# Step number; orders the steps and their file names
step = 0
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# Clean with cpptraj first: Enable cpptraj stripping / imaging / fitting (Input & cleaning) when the
# paths are applied; solvated MD output normally needs it.
clean = true

# Planner connections
[[workflow.edges]]
# Id of the producing step
source = "n2"
# Output port of the producing step
output = "topology"
# Id of the receiving step
target = "n7"
# Input port of the receiving step
input = "topology"

# Residue groups
[[groups]]
# Group name, used in selections (group:<name>), panels and legends
name = "Aptamer"
# Residue numbers or ranges, e.g. "1-40, 45"; may be chain-qualified ("A:1-40")
residues = "1-12"
# MDAnalysis selection that replaces 'residues' when given
selection = ""
# Colour of the group in the structure view, legends and charts (#rrggbb)
color = "#2a78d6"

[[groups]]
# Group name, used in selections (group:<name>), panels and legends
name = "Target"
# Residue numbers or ranges, e.g. "1-40, 45"; may be chain-qualified ("A:1-40")
residues = "13-24"
# MDAnalysis selection that replaces 'residues' when given
selection = ""
# Colour of the group in the structure view, legends and charts (#rrggbb)
color = "#eb6834"
