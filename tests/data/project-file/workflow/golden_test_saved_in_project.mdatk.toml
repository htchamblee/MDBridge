# Planner connections
[[workflow.edges]]
# Id of the producing step
source = "n1"
# Output port of the producing step
output = "topology"
# Id of the receiving step
target = "n3"
# Input port of the receiving step
input = "topology"

# Stand-alone script wizard settings, one entry per step type
[[workflow.scratch]]
# Unique id of the step
id = "wizard-vmd"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "vmd"
# Step number; orders the steps and their file names
step = 1
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 40.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.scratch.settings]
# First frame: First trajectory frame loaded (0-based).
first = 0
# Last frame: Last frame (-1: until the end).
last = -1
# Stride: Load every n-th frame.
stride = 1
# RNA style: Representation of every residue group. Choices: NewCartoon, Licorice, Ribbons, Tube,
# Surf, QuickSurf, VDW, CPK, Lines.
rna_style = "Tube"
# Bases as licorice: Overlay the nucleobases (and ribose) as licorice so base positions are visible.
bases = true
# Colour by residue group: One representation per MDATK residue group in its colour; off: colour by
# residue name.
group_colors = true
# Extra selection: Also show this VMD selection (e.g. 'resname MG and within 5 of nucleic').
selection = ""
# Extra selection style:  Choices: NewCartoon, Licorice, Ribbons, Tube, Surf, QuickSurf, VDW, CPK,
# Lines.
selection_style = "Licorice"
# Mg²⁺ as spheres: Show Mg²⁺ (resname MG) as VDW spheres.
ions = true
# Ion sphere scale: VDW radius scale for ions.
ion_scale = 0.6
# Material: VMD material of all representations. Choices: Opaque, AOChalky, AOShiny, Glossy,
# Transparent, Diffuse.
material = "AOChalky"
# Smoothing window: Trajectory smoothing of the representations (frames, 0: off).
smooth = 0
# Background:  Choices: white, black.
background = "white"
# Projection:  Choices: Orthographic, Perspective.
projection = "Orthographic"
# Depth cueing: Fade distant atoms.
depthcue = false
# Align frames: Superpose every frame on the first using the alignment selection (measure fit).
align = true
# Alignment selection: Atoms used to superpose frames.
align_sel = "nucleic and name P C4'"
# Window width: Display / image width in pixels.
width = 1280
# Window height
height = 960
# Output: Interactive: open VMD with the scene. Snapshot: render the last frame. Movie: render every
# loaded frame and join them with ffmpeg. Choices: interactive, snapshot, movie.
render = "interactive"
# Renderer: TachyonInternal works without a display (batch); snapshot captures the OpenGL window.
# Choices: TachyonInternal, snapshot.
renderer = "TachyonInternal"
# Movie frame rate
fps = 24
# VMD executable
vmd_exe = "vmd"
# ffmpeg executable
ffmpeg_exe = "ffmpeg"
# Extra Tcl commands: Run after the scene is built (before rendering).
extra_tcl = ""
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""

