[[workflow.nodes]]
# Unique id of the step
id = "n8"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "gromacs"
# Step number; orders the steps and their file names
step = 8
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 2000.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# GROMACS version: 2024+ on the workstation, 2023.3 on the cluster (loaded as a module). Choices:
# 2024, 2023.
gmx_version = "2024"
# Module to load: 'module load' line for the cluster version (empty: none).
module = "GROMACS/2023.3-CUDA-11.8.0"
# gmx executable: gmx, gmx_mpi or a full path.
gmx = "gmx"
# Convert Amber files with: ParmEd keeps off-diagonal Lennard-Jones pairs (NBfix) as [
# nonbond_params ]; acpype is an alternative; 'none' uses GROMACS files as they are. Choices:
# parmed, acpype, none.
convert = "parmed"
# Hydrogen mass repartitioning (mdp): mass-repartition-factor = 3 in every mdp (GROMACS 2024+ only)
# so dt = 0.004 ps works with constraints = h-bonds. Not needed when the Amber topology already has
# HMR.
mass_repartition = false
# Restraint force constant: kJ/mol/nm² for stages with RNA position restraints.
posres_fc = 1000.0
# Allow losing NBfix pairs: Normally the conversion stops when the Amber topology has off-diagonal
# LJ pairs that do not appear in the GROMACS topology.
allow_nbfix_loss = false
# Offload to the GPU: -nb gpu -pme gpu -bonded gpu
gpu = true
# Update on the GPU (-update gpu): Fastest on one GPU; not available with every setting.
update_gpu = false
# OpenMP threads (-ntomp): 0: let GROMACS decide.
ntomp = 0
# grompp -maxwarn: Number of grompp warnings to accept.
maxwarn = 0
# Extra mdrun flags
extra_mdrun = ""
