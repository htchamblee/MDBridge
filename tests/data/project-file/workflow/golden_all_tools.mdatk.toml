[[workflow.nodes]]
# Unique id of the step
id = "n4"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "structure-builder"
# Step number; orders the steps and their file names
step = 4
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 880.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# Build: Ideal helix: a new A-form duplex or single strand. Mutate: swap bases of the connected PDB.
# Fit: place the connected PDB in the map. Choices: helix, mutate, fit.
mode = "helix"
# Sequence (5'->3'): Strand 1; T is read as U.
sequence = ""
# Partner strand: Complement (the canonical partners of the pairing: Watson-Crick for wc), none
# (single strand) or a sequence typed below. Choices: auto, none, explicit.
partner_mode = "auto"
# Partner (5'->3'): Same length as strand 1; mismatches and G·U wobbles are allowed (reported).
partner = ""
# Pairing: Base-pair geometry of the duplex: Watson-Crick (antiparallel A-form, default), reverse
# Watson-Crick / Hoogsteen / Hoogsteen-Hoogsteen (parallel strands) or reverse Hoogsteen
# (antiparallel). For the Hoogsteen pairings strand 1 is the purine strand. Choices: wc, reverse-wc,
# hoogsteen, reverse-hoogsteen, hh.
pairing = "wc"
# Triplex: A third strand in the major groove on the Hoogsteen edge of the strand-1 purines (Watson-
# Crick duplex only). Choices: none, hoogsteen, reverse-hoogsteen.
triplex = "none"
# Third strand: The canonical motif bases (U / C+ or A / G on A / G) or a sequence typed below.
# Choices: auto, explicit.
third_mode = "auto"
# Third strand (5'->3'): Same length as strand 1; mismatches are allowed (reported).
third = ""
# Chirality: D: right-handed. L: the mirror image (left-handed, L-nucleotides). Choices: D, L.
chirality = "D"
# Chain ids: Strand 1, strand 2 (and 3 of a triplex; default C).
chains = "A,B"
# First residue (strand 1)
start1 = 1
# First residue (strand 2)
start2 = 1
# First residue (strand 3)
start3 = 1
# Residue names: Name scheme of mdatk.pdbtools. Choices: , amber, ccd, rosetta, pdb.
scheme = ""
# 5'/3' terminal names: For the schemes with terminal variants (Amber, CCD).
terminals = true
# 5'-phosphate: Keep P/OP1/OP2/OP3 on the 5' ends (the Amber 5' units have none).
phosphate5 = false
# Hydrogens: Add all hydrogens (default: heavy atoms only).
hydrogens = false
# Mutations: Chain:residue + new base, comma separated.
mutations = ""
# Compensatory partner mutations: Change the Watson-Crick / G·U partner of every mutated base to the
# complement unless it is mutated explicitly.
compensatory = true
# Keep G·U pairs: A G or U facing U / G keeps its partner (wobble) instead of the Watson-Crick
# complement.
wobble = false
# Search: Global: all orientations and positions. Local: refine the model as placed. Choices:
# global, local.
search = "global"
# Angular step: Rotation sampling of the global search.
angular_step = 30.0
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""
# Python: Interpreter that can import MDATK. From the standalone AppImage / Windows build the script
# calls that program itself instead.
python = "python3"

[[workflow.nodes]]
# Unique id of the step
id = "n5"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "restraint-dicts"
# Step number; orders the steps and their file names
step = 5
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 1160.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# Program: acedrg (CCP4) or phenix.elbow (Phenix) builds the restraints from the SMILES; MDATK then
# renames the atoms to the CCD names the model uses. Choices: acedrg, phenix.elbow.
program = "acedrg"
# Phenix version: Installed Phenix release. Choices: 1.21, 2.x.
phenix_version = "2.x"
# Phenix installation: Top folder of the Phenix installation; the script sources its phenix_env.sh.
# Leave empty when phenix.elbow is already on PATH.
phenix_dir = ""
# CCP4 setup script: Sourced before acedrg runs (ccp4.setup-sh of the CCP4 installation). Leave
# empty when acedrg is already on PATH.
ccp4_setup = ""
# Extra arguments: Added to every acedrg / phenix.elbow command line.
program_args = ""
# Residues: Model: the 5'/3' variants the connected model needs (all eight when no model is
# connected or it does not exist yet). The four parents 0A/0C/0G/0U are CCD entries that Coot and
# Phenix already know. Choices: auto, variants, all, list.
codes_mode = "auto"
# Codes: Residue codes separated by spaces or commas; codes that are not in the table need a custom
# SMILES.
codes = ""
# Polymer group: _chem_comp.group of the dictionaries. RNA lets Coot / Phenix link the residue to
# its neighbours like the CCD's L-nucleotides; non-polymer makes it a free ligand. Choices: RNA,
# non-polymer.
group = "RNA"
# Custom SMILES: One 'code = SMILES' per line. For a code of the table the SMILES replaces the
# built-in one and must describe the same molecule and stereochemistry; other codes keep the atom
# names the program invents.
custom = ""
# Fetch SMILES from PubChem when writing (network): Off: no network access. On: the isomeric SMILES
# of the compounds below is downloaded from PubChem (PUG REST) when the step's files are written,
# checked against the code's atom graph and stereochemistry, and used instead of the built-in
# SMILES.
pubchem_fetch = false
# PubChem compounds: One 'code = CID' (or compound name) per line.
pubchem_ids = ""
# Timeout: Seconds to wait for PubChem.
pubchem_timeout = 15
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""

[[workflow.nodes]]
# Unique id of the step
id = "n6"
# Step type: the script generator (see 'mdatk workflow tools')
tool = "farfar2"
# Step number; orders the steps and their file names
step = 6
# Box title ("": the step type's label)
title = ""
# Position of the box on the planner canvas
x = 1440.0
# Position of the box on the planner canvas
y = 40.0
# Hand-picked input files for ports that no connection feeds ({port = path})
files = {}

# The step's options (each one is explained by its comment)
[workflow.nodes.settings]
# Write FASTA and secstruct from the fields below: Generate the Rosetta FASTA (one entry per chain,
# lower case, A:1-16 numbering) and the secstruct file. Off: use existing files.
make_inputs = true
# Sequence: One chain per line or chains separated by spaces / '&' (optionally 'A: ggcac...').
# Residues are numbered continuously across chains.
sequence = ""
# Secondary structure: Dot-bracket for the whole sequence (strand separators optional). Paired bases
# must be complementary (G–C, A–U, G–U) or rna_denovo stops.
dotbracket = ""
# FASTA name: Name on the FASTA header lines; empty uses the project name.
fasta_name = ""
# Existing FASTA: FASTA file to use instead.
fasta_file = ""
# Existing secstruct: Secondary structure file to use instead (dot-bracket on line 1).
secstruct_file = ""
# Models per run (-nstruct): Models written by each run.
nstruct = 100
# Monte Carlo cycles (-cycles): Fragment-assembly cycles per model (Rosetta default 10 000).
cycles = 50000
# Full-atom refinement (-minimize_rna): High-resolution minimisation after assembly - strongly
# recommended.
minimize_rna = true
# Fixed stems (-fixed_stems): Seed every helix of the secondary structure with Watson–Crick pairs.
fixed_stems = true
# Base-pair-step moves: -rna:denovo:bps_moves (helix flexibility by base pair step fragments).
bps_moves = false
# Heat (-heat): Randomise torsions before assembly.
heat = true
# Close loops (-close_loops): Close chain breaks by cyclic coordinate descent after fragment moves.
close_loops = true
# Fuzz fragments: -fuzz_fragments value (0: not set).
fuzz_fragments = 5
# Autofilter (-autofilter): Keep only models that score among the best during the run.
autofilter = false
# Filter low-res base pairs: -filter_lores_base_pairs: discard models missing the secondary-
# structure pairs.
filter_lores_base_pairs = false
# Filter chain closure: -filter_chain_closure: discard models with open chain breaks.
filter_chain_closure = true
# … also halfway: -filter_chain_closure_halfway
filter_chain_closure_halfway = false
# … distance: -filter_chain_closure_distance (Å).
filter_chain_closure_distance = 15.0
# Coordinate constraints in minimiser: -rna:denovo:minimize:minimizer_use_coordinate_constraints
coord_csts = true
# Dump PDBs (-rna:denovo:out:dump): Also write PDB files into each run folder.
dump = true
# Residues of the -s PDB: -input_res: residues provided by the fixed-helix PDB. Choices: typed,
# stems.
input_res_mode = "typed"
# -input_res: Chain-qualified residues, e.g. 'A:1-6 A:13-16 B:17-20'.
input_res = ""
# Map resolution (-edensity:mapreso): Resolution of the connected map (Å).
map_reso = 4.3
# Cryo-EM scatterers: -edensity:cryoem_scatterers (electron rather than X-ray form factors).
cryoem_scatterers = true
# Density weight (elec_dens_fast): Score weight of the fit to the map.
w_density = 20.0
# coordinate_constraint: -set_weights coordinate_constraint (0: not set).
w_coordinate_constraint = 1.0
# linear_chainbreak: -set_weights linear_chainbreak (0: not set).
w_linear_chainbreak = 10.0
# Independent runs: Number of rna_denovo runs (seeds); each writes its own silent file.
runs = 12
# Parallel runs: Runs started at the same time (xargs -P).
parallel = 6
# Reproducible seeds: -run:constant_seed with -run:jran <seed base + run number>.
constant_seed = true
# Seed base: Run i uses seed base + i.
seed_base = 3000
# Run with nice: Lower the CPU priority of the runs.
nice = true
# rna_denovo executable: Name on PATH or full path, e.g. rna_denovo.default.linuxgccrelease.
exe = "rna_denovo"
# Rosetta database: -database path (empty: found by the executable).
database = ""
# Extra flags: Additional rna_denovo flags, one or more per line (written to the flags file).
extra = ""
# Conda environment: Activate this conda environment at the top of the script (eval "$(conda
# shell.bash hook)"; conda activate <name>). Leave empty when the programs are already on PATH.
conda_env = ""
# Setup commands: Shell lines run before any program, e.g. 'module load ...' on a cluster or 'source
# /opt/amber26/amber.sh' on a workstation.
env_setup = ""

