# Macro cycles: macro_cycles of real_space_refine.
macro_cycles = 5
# Global minimisation: run=minimization_global: Gradient-driven minimisation of the whole model
# against the map with geometry restraints.
run_minimization_global = true
# Rigid body: run=rigid_body: Rigid-body refinement of the chains first (a model that is not yet
# placed well).
run_rigid_body = false
# Local grid search: run=local_grid_search: Local real-space fitting of side chains / residues by
# grid search.
run_local_grid_search = true
# Morphing: run=morphing: Morphs the model towards the map: large, smooth moves of models from
# another state.
run_morphing = false
# Simulated annealing: run=simulated_annealing: Real-space simulated annealing: larger radius of
# convergence, slower.
run_simulated_annealing = false
# ADP (B-factors): run=adp: Refines atomic displacement parameters at the end.
run_adp = true
# Processors: nproc (parallel parts of the refinement).
nproc = 1
# Output prefix: output.prefix of Phenix's files (empty: <project>_<step>_phenix-rsr_<time>); the
# refined model is copied to the step's own file.
prefix = ""
# Extra parameters: Appended verbatim to the command line, one or more per line (# starts a
# comment).
extra = ""
# Nucleic-acid secondary-structure restraints: Phenix searches the model for base pairs and stacking
# and restrains them (secondary_structure.enabled=True).
na_ss = true
# Explicit base pairs: Written as base_pair restraints into a parameter (.eff) file. Dot-bracket:
# the connected secondary structure or the one typed below (nothing is written when there is none).
# Annotation: the REMARK 950 PAIR records of the model ('mdatk pdb annotate'), read when the files
# are written. Choices: none, secstruct, annotation.
pairs_source = "secstruct"
# Sequence: For a typed dot-bracket (chains separated by spaces).
sequence = ""
# Dot-bracket: Ignored when a secondary structure is connected.
dotbracket = ""
# Residue numbering: How dot-bracket positions map to residues: the nucleotides of the model in file
# order (when it exists; otherwise continuous numbering), numbers continuous across chains from 1,
# or restarting at 1 in every chain. Choices: model, continuous, chain.
numbering = "model"
# Restrain G·U wobble pairs: Saenger class 28.
wobble = true
# Stacking from the annotation: Also write the STACK records as stacking_pair restraints.
stacking = false
